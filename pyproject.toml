[project]
name = "fitted"
version = "0.1.0"
description = "AI-powered outfit recommendation app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "slowapi>=0.1.9",
    # Data validation
    "pydantic>=2.10.0",
    # HTTP client
    "httpx>=0.25.0",
    # AWS
    "boto3>=1.34.0",
    "botocore[crt]>=1.34.0",
    # Database
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
    "pgvector>=0.2.0",
    # ML / Embeddings
    "numpy>=1.26.0",
    "open-clip-torch>=2.24.0",
    "torch>=2.0.0",
    "Pillow>=10.0.0",
    # LLM
    "openai>=1.3.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    # Config
    "python-dotenv>=1.0.0",
    # Frontend
    "python-fasthtml>=0.12.0",
]

[dependency-groups]
dev = [
    "black>=25.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "nest-asyncio>=1.6.0",
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
    "mlflow>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
